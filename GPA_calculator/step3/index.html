<!DOCTYPE html>
<html>
<head>
    <title>GPA Calculator - Step 3</title>
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-primary">GPA Calculator</h1>
        
     
        <div id="result"></div>
        
      
        <form id="gpaForm">
            <div id="courses">
                <div class="row mb-2">
                    <div class="col-md-5">
                        <input type="text" name="course[]" class="form-control" placeholder="Course Name">
                    </div>
                    <div class="col-md-2">
                        <input type="number" name="credits[]" class="form-control" placeholder="Credits">
                    </div>
                    <div class="col-md-3">
                        <select name="grade[]" class="form-select">
                            <option value="4.0">A</option>
                            <option value="3.0">B</option>
                            <option value="2.0">C</option>
                            <option value="1.0">D</option>
                            <option value="0.0">F</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <button type="button" id="addCourse" class="btn btn-secondary">+ Add Course</button>
            <button type="submit" class="btn btn-primary">Calculate GPA</button>
        </form>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
